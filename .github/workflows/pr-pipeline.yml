name: pr-flow
on:
  pull_request:
    branches: master
    types: 
    - opened
    - synchronize
permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: '3.12'
      run_tests: true
      dependency_scan: true

  pr-comment:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - name: print summary
      run: echo "PR checks passed for branch- ${{ github.head_ref }}"
